[project]
name = "argus"
version = "0.1.0"
description = "Agentic Risk & Governance Unified Screening: explainable multi-agent KYC screening"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Arjun Ganesh" }]
dependencies = [
    "azure-ai-projects>=2.7.0",
    "azure-core>=1.41.0",
    "azure-cosmos>=4.17.1",
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
ui = [
    "gradio>=6.28.0",
]
data = [
    "azure-storage-blob>=12.30.3",
    "networkx>=3.7",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
]

[tool.uv]
package = false
default-groups = ["dev", "ui", "data"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["agents", "api", "utils", "accessibility", "community", "ui", "config"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["archive/", "data/", "scripts/", "infra/", "foundry_iq/"]
