[project]
name = "argus"
version = "0.1.0"
description = "Agentic Risk & Governance Unified Screening: explainable multi-agent KYC screening"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Arjun Ganesh" }]
dependencies = [
    "agent-framework-core==1.19.0",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-core>=1.41.0",
    "azure-cosmos>=4.17.1",
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "packaging>=26.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
# Local OCR. Also needs the Tesseract program itself (https://tesseract-ocr.github.io/).
ocr = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
]
# The dependency audit, locked like everything else so CI runs a known pip-audit release.
audit = [
    "pip-audit>=2.10.1",
]
data = [
    "azure-storage-blob>=12.30.3",
    "faker>=40.39.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# The application is the installable package `argus` in src/ (the standard "src layout"):
# `uv sync` installs it in editable mode, so every entry point imports `argus.*` directly.
default-groups = ["dev", "data", "ocr"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["archive"]
src = ["src"]

[tool.ruff.lint]
# Style and correctness (E, F, W, I, B, UP, SIM, RUF), plus security (S, the bandit rules),
# complexity (C90), async misuse (ASYNC), broad exception handlers (BLE), performance (PERF) and
# pathlib use (PTH).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C90", "ASYNC", "BLE", "PERF", "PTH"]
# The × and ℹ characters in strings and docstrings are intentional typography.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Long literals that must not be rewrapped:
# - explain_decision.py holds the prompt text that the v2 experiment uses as its baseline;
#   re-wrapping it would change what the model receives.
# - demo_profiles.py and the data generators are data tables.
# - infra/ holds operator scripts with long schema and query literals.
"src/argus/agents/compliance/tools/explain_decision.py" = ["E501"]
"src/argus/utils/demo_profiles.py" = ["E501"]
# Tests use `assert` by design.
"tests/**" = ["S101"]
# The data generators draw synthetic records from `random` on purpose: nothing they produce is a
# secret, and seeded randomness keeps the data reproducible.
"data/**" = ["E501", "S311"]
# The infra scripts call Azure REST endpoints built from the https endpoints in `.env`.
"infra/**" = ["E501", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source_pkgs = ["argus"]
branch = true

[tool.coverage.report]
# Every measured line and branch is covered. New code arrives with its tests; a line that truly
# cannot be tested is excluded explicitly (exclude_also below), never by lowering this floor.
fail_under = 100
show_missing = true
skip_covered = true
# Script entry points start servers; they are exercised by running the app, not by tests.
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
mypy_path = "src"
files = ["src"]
