name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The interpreter comes from .python-version, so CI, local runs and Docker agree.
  UV_LOCKED: "1"
  # Tests run with no cloud credentials. Every external client falls back to mock data.
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Ruff lint
        run: uv run --only-group dev ruff check . --output-format github
      - name: Ruff format
        run: uv run --only-group dev ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Mypy
        run: uv run mypy agents api utils accessibility community ui config.py

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # The floor lives in pyproject.toml ([tool.coverage.report] fail_under) and is set to the
      # measured value. Raise it when coverage rises; lowering it is a deliberate, reviewed change.
      - name: Pytest with coverage floor
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Audit exactly the locked graph, every group included.
      - name: Export the locked requirements
        run: uv export --all-groups --no-emit-project --format requirements.txt > locked-requirements.txt
      - name: pip-audit
        run: uvx pip-audit --strict --requirement locked-requirements.txt --disable-pip

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - uses: astral-sh/setup-uv@v10
      - name: Docs agree with the repository
        run: uv run --no-project python scripts/check_docs.py
