name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml reruns this whole gate on the tagged commit.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The interpreter comes from .python-version, so CI, local runs and Docker agree.
  UV_LOCKED: "1"
  # Tests run with no cloud credentials, on the local data plane and a fixture data set.
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Ruff lint
        run: uv run --only-group dev ruff check . --output-format github
      - name: Ruff format
        run: uv run --only-group dev ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Mypy
        run: uv run mypy

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # The local OCR test reads a rendered document with the real Tesseract program.
      - name: Install Tesseract
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      # The floor lives in pyproject.toml ([tool.coverage.report] fail_under) and is 100%, line and
      # branch. Lowering it is a deliberate, reviewed change.
      - name: Pytest with coverage floor
        env:
          REQUIRE_TESSERACT: "1"
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Audit exactly the locked graph, every group included.
      - name: Export the locked requirements
        run: uv export --all-groups --no-emit-project --format requirements.txt > locked-requirements.txt
      - name: pip-audit
        run: uvx pip-audit --strict --requirement locked-requirements.txt --disable-pip

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag argus:ci .
      # One demo assessment end to end through the image, with no cloud credentials.
      - name: Smoke assessment
        run: |
          docker run --detach --name argus --publish 8000:8000 argus:ci
          python3 scripts/ci/smoke_api.py 8000
      - name: The health check passes
        run: timeout 90 sh -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" argus)" = healthy ]; do sleep 2; done'
      - name: Container log
        if: always()
        run: docker logs argus || true

  infra:
    name: Infrastructure template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: compiles the template and runs the Bicep linter; any warning fails the job.
      - name: Build and lint infra/main.bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep 2>&1 | tee lint.txt
          ! grep -E ' : (Warning|Error) ' lint.txt

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # The site calls the API container started below; the API allows the site's origin.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked packages
        run: npm ci --ignore-scripts --no-fund
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # Blocks on any advisory in what the site ships. The build tools (dev dependencies) are
      # reported but don't block: an advisory there can have no fixed version yet.
      - name: npm audit
        run: |
          npm audit --omit=dev
          npm audit || echo "::warning::npm audit found advisories in dev dependencies only"
      - name: Start the API container
        working-directory: .
        run: |
          docker build --tag argus:ci .
          docker run --detach --name argus --publish 8000:8000 \
            --env ARGUS_CORS_ORIGINS=http://127.0.0.1:3000 argus:ci
          python3 scripts/ci/smoke_api.py 8000
      - name: Install the browser
        run: npm run e2e:browsers -- --with-deps
      # The six demo scenarios end to end in light, dark and phone layouts, with axe checks.
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: API container log
        if: always()
        working-directory: .
        run: docker logs argus || true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Docs agree with the repository
        run: uv run python scripts/ci/check_docs.py
      - name: Version pins agree
        run: uv run python scripts/ci/check_versions.py --check
      # Theme variants must match their SVG masters, and every declared text colour pair must
      # pass WCAG AA in both themes. Rasters (PNG/GIF) need a browser and are not checked here.
      - name: Brand and architecture assets are current
        run: uv run python scripts/ci/render_assets.py --check
