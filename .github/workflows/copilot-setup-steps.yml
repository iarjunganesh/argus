name: Copilot setup steps

# Prepares the environment the GitHub Copilot coding agent works in, so it starts with the locked
# dependencies installed and can run the commands in AGENTS.md straight away. The job name must be
# exactly `copilot-setup-steps`. The push and pull_request triggers validate this file when it
# changes.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked environment
        run: |
          uv sync --locked --no-build
          npm ci --prefix web --ignore-scripts --no-fund
      - name: Confirm the checks can run
        run: |
          uv run --no-sync --no-build pytest --collect-only -q
          npm --prefix web test
