name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag whose dependency refresh should be retried
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.release-tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    # Pass only what CI uses; DEPS_BOT_TOKEN must not reach the CI jobs.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Validate release metadata and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event.inputs.release-tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never interpolate dispatch input into shell code.
          python -c 'import os,re; assert re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(alpha|beta|rc)\.[1-9]\d*)?", os.environ["RELEASE_TAG"])'
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release view "$RELEASE_TAG" --json tagName --jq .tagName
          fi
          git checkout --detach "refs/tags/$RELEASE_TAG"
          uv run --locked python scripts/ci/release_notes.py "$RELEASE_TAG" --output .tmp/release-notes.md
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name == 'push'
    needs: [quality, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: uv run --locked python scripts/ci/release_notes.py "$RELEASE_TAG" --output .tmp/release-notes.md
      # The runner's own gh CLI publishes, so no third-party action holds contents: write.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          prerelease=()
          case "$RELEASE_TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag             --title "$RELEASE_TAG" --notes-file .tmp/release-notes.md "${prerelease[@]}"

  refresh-deps:
    needs: [validate, publish]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      python: ${{ steps.candidate.outputs.python }}
    steps:
      - name: Require a token that triggers PR CI
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
        run: test -n "$DEPS_TOKEN" || { echo '::error::Set DEPS_BOT_TOKEN before releasing'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # `uv run --locked` installs the locked environment itself, so a broken lock fails inside
      # this continue-on-error step and still ends in a labelled review PR.
      - name: Refresh and run the Python gates
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: uv run --locked python scripts/ci/refresh_dependencies.py "$RELEASE_TAG"
      - name: Markdown gate
        id: markdown
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
      - name: Secret gate
        id: secrets
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Finish the review report
        if: always()
        env:
          REFRESH: ${{ steps.refresh.outcome }}
          MARKDOWN: ${{ steps.markdown.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          mkdir -p .tmp
          # A refresh that stopped before writing its report (for example when the lock cannot be
          # installed) must not leave the previous report in place.
          grep -qF "Refresh after \`$RELEASE_TAG\`." docs/DEPENDENCY-REFRESH.md 2>/dev/null ||
            printf '# Dependency refresh\n\nRefresh after `%s` failed before it could write its report. See the run log.\n' "$RELEASE_TAG" > docs/DEPENDENCY-REFRESH.md
          printf '\nWorkflow checks: refresh=%s, markdown=%s, secrets=%s.\n' "$REFRESH" "$MARKDOWN" "$SECRETS" >> docs/DEPENDENCY-REFRESH.md
          printf '\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> docs/DEPENDENCY-REFRESH.md
          cp docs/DEPENDENCY-REFRESH.md .tmp/dependency-pr.md
      - name: Read interpreter candidate
        id: candidate
        if: steps.refresh.outcome == 'success'
        run: |
          if [ -s .tmp/python-candidate.txt ]; then
            echo "python=$(cat .tmp/python-candidate.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the dependency review PR even when checks fail
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}
          branch: deps/after-${{ needs.validate.outputs.tag }}
          base: main
          title: 'deps: refresh after ${{ needs.validate.outputs.tag }}'
          commit-message: 'deps: refresh after ${{ needs.validate.outputs.tag }}'
          body-path: .tmp/dependency-pr.md
          labels: ${{ (steps.refresh.outcome != 'success' || steps.markdown.outcome != 'success' || steps.secrets.outcome != 'success') && 'deps-broken' || '' }}
          add-paths: |
            pyproject.toml
            uv.lock
            .github/workflows
            docs/DEPENDENCY-REFRESH.md
      - name: Fail visibly if any refresh gate failed
        if: steps.refresh.outcome != 'success' || steps.markdown.outcome != 'success' || steps.secrets.outcome != 'success'
        run: exit 1

  refresh-python:
    needs: [validate, refresh-deps]
    if: needs.refresh-deps.outputs.python != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Prepare the separate interpreter change
        env:
          PYTHON_MINOR: ${{ needs.refresh-deps.outputs.python }}
        run: |
          uv run --locked python scripts/ci/check_versions.py --write-python "$PYTHON_MINOR"
          uv lock --python "$PYTHON_MINOR"
          # Recheck this PR's lock, which may differ from the library refresh branch.
          .venv/bin/python scripts/ci/check_versions.py --check-python-wheels "$PYTHON_MINOR"
          uv sync --locked --python "$PYTHON_MINOR" --no-build --no-install-project
      - name: Open interpreter PR for the full CI gate
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}
          branch: deps/python-${{ needs.refresh-deps.outputs.python }}
          base: main
          title: 'deps: Python ${{ needs.refresh-deps.outputs.python }}'
          commit-message: 'deps: Python ${{ needs.refresh-deps.outputs.python }}'
          body: >-
            Candidate discovered after ${{ needs.validate.outputs.tag }}. Locked dependencies
            have compatible Linux x86_64 and Windows amd64 wheels. Linux binary-only sync passed.
            The complete PR CI gate must pass before merge. Review separately from library updates.
          add-paths: |
            .python-version
            pyproject.toml
            uv.lock
            README.md
