<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-labelledby="title desc">
  <title id="title">ARGUS — social preview</title>
  <desc id="desc">The ARGUS eye emblem, the wordmark, 'Agentic Risk &amp; Governance Unified Screening', the tagline 'Explainable KYC screening, built for the people automated compliance fails.', and the Hack for Good winner mark.</desc>

  <!-- GitHub social preview, 1280×640. Upload the rendered PNG in the repository settings.
       The emblem geometry is shared with logo-mark.svg, logo.svg, banner.svg, banner-16x9.svg
       and social-preview.svg; change it in all of them together. scripts/render_assets.py
       writes the -light and -dark variants. Durations divide 6 s; frame 0 carries the meaning. -->
  <style>
/* PALETTE:LIGHT */
svg {
  --bg-a:#FFFFFF; --bg-b:#EEF4FC; --glow:#DBEAFE; --ink:#0B1633; --muted:#475569;
  --brand:#1C3F8C; --gold:#855607; --word-a:#13306E; --word-b:#2563EB; --chip:#FFFFFF;
  --chip-edge:#CBD5E1; --horizon:#2563EB; --hz-op:.10; --mesh:#1C3F8C; --net:#2563EB; --node:#1D4ED8;
  --metal-a:#3B82F6; --metal-b:#1C3F8C; --metal-c:#0B2A6B; --metal-d:#60A5FA;
  --metal-edge:#1C3F8C; --eye-fill:#EAF2FF; --eye:#0284C7; --iris-ring:#0284C7;
  --axis:#2563EB; --ring:#1C3F8C; --dot:#2563EB;
}
/* /PALETTE:LIGHT */
/* PALETTE:DARK */
@media (prefers-color-scheme: dark) {
svg {
  --bg-a:#020914; --bg-b:#061521; --glow:#0B3650; --ink:#E8EEFA; --muted:#A3B3D1;
  --brand:#6FD7FF; --gold:#F5B83D; --word-a:#FFFFFF; --word-b:#7EB9DF; --chip:#0B1A2B;
  --chip-edge:#2A4A66; --horizon:#7DDFFF; --hz-op:.22; --mesh:#4FCAF5; --net:#79DCFF; --node:#D9FBFF;
  --metal-a:#F5FBFF; --metal-b:#2C7098; --metal-c:#9ED7F0; --metal-d:#5CA8D7;
  --metal-edge:#B7EBFF; --eye-fill:#061521; --eye:#67D5FF; --iris-ring:#4BD7FF;
  --axis:#45D7FF; --ring:#3FB9ED; --dot:#6FD7FF;
}
}
/* /PALETTE:DARK */
/* CONTRAST ink:bg-a ink:bg-b muted:bg-a muted:bg-b brand:bg-a brand:bg-b gold:chip ink:chip
   muted:chip */

text   { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.bg-a  { stop-color: var(--bg-a); }
.bg-b  { stop-color: var(--bg-b); }
.glow  { stop-color: var(--glow); }
.glow0 { stop-color: var(--glow); stop-opacity: 0; }
.w-a   { stop-color: var(--word-a); }
.w-b   { stop-color: var(--word-b); }
.m-a   { stop-color: var(--metal-a); }
.m-b   { stop-color: var(--metal-b); }
.m-c   { stop-color: var(--metal-c); }
.m-d   { stop-color: var(--metal-d); }
.hz-a  { stop-color: var(--horizon); stop-opacity: var(--hz-op); }
.hz-b  { stop-color: var(--horizon); stop-opacity: 0; }
.metal { fill: url(#metal); stroke: var(--metal-edge); stroke-width: 2; }
.metal2{ fill: url(#metal2); opacity: .92; }
.eye   { fill: var(--eye-fill); stroke: var(--eye); stroke-width: 3; }
.iring { fill: none; stroke: var(--iris-ring); stroke-width: 4; }
.axis  { stroke: var(--axis); stroke-width: 2.5; }
.ring  { fill: none; stroke: var(--ring); opacity: .22; }
.dot   { fill: var(--dot); }
.word  { fill: url(#word); font-weight: 700; }
.sub   { fill: var(--brand); font-weight: 600; }
.tag   { fill: var(--muted); }
.chip  { fill: var(--chip); stroke: var(--chip-edge); stroke-width: 1.5; }
.gold  { fill: var(--gold); font-weight: 700; }
.chipt { fill: var(--ink); font-weight: 700; }
.hzline{ fill: none; stroke: var(--horizon); stroke-width: 3; opacity: .9; }
.hzfill{ fill: url(#hz); }
.mesh  { fill: none; stroke: var(--mesh); stroke-width: 1; }
.net   { fill: none; stroke: var(--net); stroke-width: 1.5; opacity: .7; }
.node  { fill: var(--node); }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop class="bg-a" offset="0"/><stop class="bg-b" offset="1"/>
    </linearGradient>
    <radialGradient id="bgglow" cx=".22" cy=".42" r=".45">
      <stop class="glow" offset="0" style="stop-opacity:.55"/><stop class="glow0" offset="1"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop class="w-a" offset=".35"/><stop class="w-b" offset="1"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop class="m-a" offset="0"/><stop class="m-c" offset=".22"/><stop class="m-b" offset=".48"/>
      <stop class="m-a" offset=".72"/><stop class="m-d" offset="1"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="1" x2="1" y2="0">
      <stop class="m-b" offset="0"/><stop class="m-a" offset=".35"/><stop class="m-d" offset=".68"/>
      <stop class="m-a" offset="1"/>
    </linearGradient>
    <radialGradient id="iris" cx=".35" cy=".28" r=".75">
      <stop offset="0" stop-color="#D7FBFF"/><stop offset=".18" stop-color="#75DAF3"/>
      <stop offset=".52" stop-color="#1D6C9C"/><stop offset="1" stop-color="#071E35"/>
    </radialGradient>
    <linearGradient id="hz" x1="0" y1="0" x2="0" y2="1">
      <stop class="hz-a" offset="0"/><stop class="hz-b" offset="1"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globe"><ellipse cx="640" cy="900" rx="900" ry="330"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#bgglow)"/>
  <ellipse class="hzfill" cx="640" cy="900" rx="900" ry="330"/>
  <g clip-path="url(#globe)" class="mesh">
      <ellipse cx="640" cy="900" rx="900" ry="330" opacity="0.14"/>
      <ellipse cx="640" cy="900" rx="702" ry="257" opacity="0.18"/>
      <ellipse cx="640" cy="900" rx="504" ry="185" opacity="0.2"/>
      <ellipse cx="640" cy="900" rx="306" ry="112" opacity="0.18"/>
      <path d="M -260,780 Q 640,610 1540,780" opacity=".2"/>
      <path d="M -170,740 Q 640,570 1450,740" opacity=".2"/>
      <path d="M -80,820 Q 640,650 1360,820" opacity=".2"/>
  </g>
  <path class="hzline" d="M -210,640 Q 640,510 1490,640" filter="url(#soft)"/>
  <g class="net" filter="url(#soft)">
      <path d="M 160,632 Q 380,490 600,580"/>
      <path d="M 600,580 Q 840,490 1080,612"/>
      <path d="M 1080,612 Q 620,522 160,632"/>
  </g>
  <g filter="url(#soft)">
      <circle class="node" cx="160" cy="632" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="1.5s" begin="0.0s" repeatCount="indefinite"/></circle>
      <circle class="node" cx="360" cy="596" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle class="node" cx="600" cy="580" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="1.5s" begin="1.0s" repeatCount="indefinite"/></circle>
      <circle class="node" cx="840" cy="590" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="1.5s" begin="0.0s" repeatCount="indefinite"/></circle>
      <circle class="node" cx="1080" cy="612" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle class="node" cx="1220" cy="636" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="1.5s" begin="1.0s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(280 262.64) scale(0.78)">
    <g class="ring">
      <circle cx="0" cy="12" r="150" stroke-width="1.4"/>
      <circle cx="0" cy="12" r="200" stroke-width="2" stroke-dasharray="4 10"/>
    </g>
    <g class="ring">
      <circle cx="0" cy="12" r="250" stroke-width="1.6" stroke-dasharray="2 12 18 12"/>
    </g>
    <g filter="url(#soft)">
      <circle class="dot" cx="0" cy="-188" r="6"/>
      <circle class="dot" cx="190.2" cy="-49.8" r="5"/>
      <circle class="dot" cx="117.6" cy="173.8" r="5"/>
      <circle class="dot" cx="-117.6" cy="173.8" r="5"/>
      <circle class="dot" cx="-190.2" cy="-49.8" r="5"/>
    </g>
    <line class="axis" x1="0" y1="-236" x2="0" y2="236">
      <animate attributeName="opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/>
    </line>
    <path class="metal" d="M -198,6 Q -98,-126 0,-170 Q 98,-126 198,6 Q 104,-53 0,-53 Q -104,-53 -198,6 Z"/>
    <path class="metal2" d="M -167,8 Q -80,-84 0,-84 Q 80,-84 167,8 Q 80,-24 0,-24 Q -80,-24 -167,8 Z"/>
    <path class="metal" d="M -168,18 Q -76,87 0,145 Q 76,87 168,18 Q 72,59 0,59 Q -72,59 -168,18 Z"/>
    <path class="eye" d="M -175,12 Q -89,-70 0,-70 Q 89,-70 175,12 Q 89,94 0,94 Q -89,94 -175,12 Z"/>
    <circle class="iring" cx="0" cy="12" r="70"/>
    <circle cx="0" cy="12" r="43" fill="url(#iris)" stroke="#90E8FF" stroke-width="1.5"/>
    <circle cx="13" cy="-4" r="8" fill="#DFFAFF" opacity=".9"/>
  </g>
  <text class="word" x="520" y="250" font-size="124" letter-spacing="11">ARGUS</text>
  <text class="sub" x="524" y="298" font-size="19.5" letter-spacing="4.2">AGENTIC RISK &amp; GOVERNANCE UNIFIED SCREENING</text>
  <text class="tag" x="524" y="356" font-size="25">Explainable KYC screening, built for the</text>
  <text class="tag" x="524" y="390" font-size="25">people automated compliance fails.</text>
  <rect class="chip" x="524" y="420" width="560" height="40" rx="20.0"/>
  <text class="gold" x="804.0" y="445" font-size="15" letter-spacing="1.8" text-anchor="middle">HACK FOR GOOD WINNER · MICROSOFT AGENTS LEAGUE 2026</text>
</svg>
