  <title id="title">ARGUS v2 target architecture (planned, not built)</title>
  <desc id="desc">The planned v2 runtime. None of it runs yet. A Next.js web UI on Vercel calls one
  FastAPI container on Azure Container Apps that scales to zero. Inside it, a Microsoft Agent
  Framework workflow runs the orchestrator, the four specialist agents concurrently, and the
  Compliance and Risk agent, followed by Explain Mode, which writes an analyst explanation and a
  plain-language explanation for human review. Models sit behind one provider setting. Fabric IQ
  and Work IQ are reached as MCP tools. The data plane has four interfaces, Retriever,
  EntityStore, ReportStore and OCR, each with an Azure implementation and a local one; Foundry IQ
  is the Azure retriever. Telemetry uses OpenTelemetry.</desc>

