<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     role="img" aria-labelledby="title desc">
  <title id="title">ARGUS investigation flow: one KYC request, end to end</title>
  <desc id="desc">Five steps. 1, submit: a KYC request with the entity name, type and jurisdiction
  returns a report ID at once. 2, fan-out: the Identity, Screening, Corporate and Transaction
  agents run in parallel and each computes a score with fixed rules. 3, fan-in: the Compliance and
  Risk agent weights the five dimensions (screening 30 percent, regulatory 25, identity 20,
  corporate 15, transaction 10), maps the overall score to a tier (low below 35, medium from 35,
  high from 55, critical from 75) and maps each risk indicator to FATF recommendations. Steps 2
  and 3 are deterministic code. 4, explain: a language model writes three to five plain-English
  sentences; it cannot change the score or the tier, and without a model a fixed template is used.
  5, report: decision, findings, actions, citations, dimension scores and an audit trace. A
  compliance reviewer confirms the findings before any onboarding decision.</desc>

