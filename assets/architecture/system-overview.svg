  <path class="edge" d="M230 216 V259" marker-end="url(#arrow)"/>

  <rect class="box" x="60" y="265" width="340" height="130" rx="14"/>
  <text class="label" x="230" y="316">Gradio UI</text>
  <text class="sub" x="230" y="348">port 7860</text>
  <text class="sub" x="230" y="376">to be replaced by a web UI</text>

  <path class="edge" d="M230 395 V454" marker-end="url(#arrow)"/>
  <text class="note" x="244" y="431">submit · poll status</text>

  <rect class="box" x="60" y="460" width="340" height="150" rx="14"/>
  <text class="label" x="230" y="514">API gateway</text>
  <text class="sub" x="230" y="547">FastAPI · port 8000</text>
  <text class="sub" x="230" y="577">reports via the report store</text>

  <path class="edge" d="M230 610 V689" marker-end="url(#arrow)"/>
  <text class="note" x="244" y="656">fetch report</text>

  <rect class="box2" x="60" y="695" width="340" height="215" rx="14"/>
  <text class="step" x="230" y="731">OUTPUT</text>
  <text class="label" x="230" y="772">Risk report</text>
  <text class="sub" x="230" y="808">tier · score · findings</text>
  <text class="sub" x="230" y="838">citations · audit trace</text>
  <text class="sub" x="230" y="868">source of every result</text>

  <!-- gateway ⇄ orchestrator -->
  <path class="edge" d="M406 535 H440 V262 H704" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edgetxt" x="590" y="250">background task · report</text>

  <!-- ============ Column B: the five agent services ============ -->
  <rect class="frame" x="470" y="180" width="880" height="740" rx="18"/>
  <text class="edgetxt" x="910" y="904">Five agent services · a custom JSON envelope over HTTP (not the A2A protocol)</text>

  <rect class="accent" x="710" y="210" width="400" height="130" rx="14"/>
  <text class="on" x="910" y="262">Orchestrator</text>
  <text class="onsub" x="910" y="296">fan-out × 4 in parallel · fan-in</text>
  <text class="onsub" x="910" y="324">synthesises the report</text>

  <!-- fan-out -->
  <path id="out1" class="flow" d="M910 340 V380 H587 V414" marker-end="url(#flowarrow)"/>
  <path id="out2" class="flow" d="M910 340 V380 H802 V414" marker-end="url(#flowarrow)"/>
  <path id="out3" class="flow" d="M910 340 V380 H1017 V414" marker-end="url(#flowarrow)"/>
  <path id="out4" class="flow" d="M910 340 V380 H1232 V414" marker-end="url(#flowarrow)"/>
  <circle class="pulse" r="6"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#out1"/></animateMotion></circle>
  <circle class="pulse" r="6"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#out2"/></animateMotion></circle>
  <circle class="pulse" r="6"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#out3"/></animateMotion></circle>
  <circle class="pulse" r="6"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#out4"/></animateMotion></circle>

