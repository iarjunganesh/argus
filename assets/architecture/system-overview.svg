<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     role="img" aria-labelledby="title desc">
  <title id="title">ARGUS system overview: the current runtime</title>
  <desc id="desc">An analyst uses the Gradio UI, which posts to the FastAPI gateway. The gateway runs
  the orchestrator as a background task. The orchestrator fans out to the Identity, Screening,
  Corporate and Transaction agent services in parallel over HTTP with a custom JSON envelope, and
  fans their results in to the Compliance and Risk agent, which computes a deterministic score,
  tier and gaps and asks a language model for the explanation. Six recorded demo profiles can
  replace the four parallel calls. Every agent reads data through one data plane of four
  interfaces, each with a local implementation (synthetic data, the default) and an Azure one:
  the retriever (AI Search), the entity store and the report store (Cosmos DB), and OCR (Document
  Intelligence, with no local engine yet). A language model, chosen by one setting, writes only the
  explanation. The Azure implementations have not yet been run against live services.</desc>

  <!-- Hand-placed master. scripts/ci/render_assets.py writes the -light and -dark variants.
       Every status here is checked against the code, not the plan: see docs/ARCHITECTURE.md.
       Animation is decoration only; frame 0 carries the whole diagram. Durations divide 6s. -->
  <style>
/* PALETTE:LIGHT */
svg {
  --bg:#FFFFFF; --card:#F1F5FB; --card2:#E3EBF7; --edge:#64748B; --grid:#E2E8F0;
  --ink:#0B1633; --muted:#475569; --brand:#1C3F8C; --flow:#2563EB;
  --accent:#1D4ED8; --decision:#13306E; --on:#FFFFFF; --onsub:#DBEAFE;
  --green:#15803D; --red:#B91C1C;
}
/* /PALETTE:LIGHT */
/* PALETTE:DARK */
@media (prefers-color-scheme: dark) {
svg {
  --bg:#0B1220; --card:#131E36; --card2:#1B2946; --edge:#8394B8; --grid:#1E2A44;
  --ink:#E8EEFA; --muted:#A3B3D1; --brand:#5AB0FF; --flow:#7DD4FF;
  --accent:#1D4ED8; --decision:#1E3A8A; --on:#FFFFFF; --onsub:#DBEAFE;
  --green:#4ADE80; --red:#F87171;
}
}
/* /PALETTE:DARK */
/* CONTRAST ink:bg muted:bg ink:card muted:card ink:card2 muted:card2 brand:bg brand:card
   brand:card2 green:card red:card on:accent onsub:accent on:decision onsub:decision edge:bg */

text     { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.bg      { fill: var(--bg); }
.grid    { stroke: var(--grid); stroke-width: 2; }
.h1      { fill: var(--ink); font-size: 44px; font-weight: 700; }
.h2      { fill: var(--muted); font-size: 22px; }
.box     { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
.box2    { fill: var(--card2); stroke: var(--edge); stroke-width: 2; }
.accent  { fill: var(--accent); }
.decision{ fill: var(--decision); }
.frame   { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: 8 8; }
.dashbox { fill: var(--card); stroke: var(--edge); stroke-width: 2; stroke-dasharray: 8 6; }
.label   { fill: var(--ink); font-size: 28px; font-weight: 600; text-anchor: middle; }
.name    { fill: var(--ink); font-size: 25px; font-weight: 600; }
.sub     { fill: var(--muted); font-size: 19px; text-anchor: middle; }
.note    { fill: var(--muted); font-size: 17px; }
.tool    { fill: var(--muted); font: 15px 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace; text-anchor: middle; }
.on      { fill: var(--on); font-size: 28px; font-weight: 600; text-anchor: middle; }
.onsub   { fill: var(--onsub); font-size: 19px; text-anchor: middle; }
.step    { fill: var(--brand); font-size: 15px; font-weight: 700; letter-spacing: 3px; text-anchor: middle; }
.stepl   { fill: var(--brand); font-size: 15px; font-weight: 700; letter-spacing: 3px; }
.edge    { stroke: var(--edge); stroke-width: 2.5; fill: none; }
.dashed  { stroke: var(--edge); stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; }
.flow    { stroke: var(--flow); stroke-width: 3; fill: none; }
.edgetxt { fill: var(--muted); font-size: 17px; text-anchor: middle; }
.pulse   { fill: var(--flow); }
.chip-ok { fill: none; stroke: var(--green); stroke-width: 2; }
.chip-no { fill: none; stroke: var(--red); stroke-width: 2; }
.ok      { fill: var(--green); }
.no      { fill: var(--red); }
.chiptxt-ok { fill: var(--green); font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
.chiptxt-no { fill: var(--red); font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
.legend  { fill: var(--muted); font-size: 20px; }
.foot    { fill: var(--muted); font-size: 18px; text-anchor: end; }
.arrowhead { fill: var(--edge); }
.flowhead  { fill: var(--flow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="flowarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path class="flowhead" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text class="h1" x="60" y="86">ARGUS — System overview</text>
  <text class="h2" x="60" y="126">How ARGUS runs today: seven processes, five agent services over HTTP, and one data plane, local or Azure.</text>
  <line class="grid" x1="60" y1="152" x2="1860" y2="152"/>

