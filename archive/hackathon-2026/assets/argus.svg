<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 390" role="img" aria-label="ARGUS — Agentic Risk and Governance Unified Screening">
  <defs>

    <!-- Central orb: deep blue to bright highlight -->
    <radialGradient id="orbGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#7DD4FF"/>
      <stop offset="40%"  stop-color="#2B82E8"/>
      <stop offset="100%" stop-color="#08205E"/>
    </radialGradient>

    <!-- Pentagon fill: dark navy, slightly lighter at centre -->
    <radialGradient id="pentFill" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#1C3F8C"/>
      <stop offset="100%" stop-color="#09184A"/>
    </radialGradient>

    <!-- Banner gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#09184A"/>
      <stop offset="48%"  stop-color="#142F7A"/>
      <stop offset="100%" stop-color="#09184A"/>
    </linearGradient>

    <!-- Node fill: white with subtle blue tint at centre -->
    <radialGradient id="nodeFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8EAFF"/>
    </radialGradient>

    <!-- Pentagon outer glow — gives presence on dark backgrounds -->
    <filter id="pentGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orb soft glow -->
    <filter id="orbGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node pulse glow -->
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Banner drop shadow -->
    <filter id="bannerShadow" x="-12%" y="-20%" width="124%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000033" flood-opacity="0.55"/>
    </filter>

    <!-- Pentagon drop shadow -->
    <filter id="pentShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000033" flood-opacity="0.45"/>
    </filter>

    <!-- Subtitle: white halo so it reads on dark AND light backgrounds -->
    <filter id="subtitleHalo" x="-8%" y="-80%" width="116%" height="360%">
      <feFlood flood-color="white" flood-opacity="0.0" result="bg"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="white" flood-opacity="0.7" result="haloColor"/>
      <feComposite in="haloColor" in2="blur" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── PENTAGON OUTER GLOW (dark-mode halo) ─────────────────────── -->
  <polygon
    points="250,35 355,111 315,234 185,234 145,111"
    fill="#1C3F8C"
    opacity="0.35"
    filter="url(#pentGlow)"/>

  <!-- ── MAIN PENTAGON ─────────────────────────────────────────────── -->
  <polygon
    points="250,35 355,111 315,234 185,234 145,111"
    fill="url(#pentFill)"
    stroke="#2B6DD4"
    stroke-width="2.5"
    filter="url(#pentShadow)"/>

  <!-- Inner pentagon echo (adds depth) -->
  <polygon
    points="250,67 325,122 299,203 201,203 175,122"
    fill="none"
    stroke="#2B6DD4"
    stroke-width="0.8"
    opacity="0.35"/>

  <!-- ── A2A CONNECTION LINES ───────────────────────────────────────── -->
  <!-- Each line fades from centre (bright) toward node (dimmer) -->
  <line x1="250" y1="145" x2="250"  y2="35"  stroke="#5AB0FF" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>
  <line x1="250" y1="145" x2="355"  y2="111" stroke="#5AB0FF" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>
  <line x1="250" y1="145" x2="315"  y2="234" stroke="#5AB0FF" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>
  <line x1="250" y1="145" x2="185"  y2="234" stroke="#5AB0FF" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>
  <line x1="250" y1="145" x2="145"  y2="111" stroke="#5AB0FF" stroke-width="1.8" opacity="0.75" stroke-linecap="round"/>

  <!-- ── NODE GLOW HALOS ────────────────────────────────────────────── -->
  <circle cx="250" cy="35"  r="22" fill="#5AB0FF" opacity="0.22" filter="url(#nodeGlow)"/>
  <circle cx="355" cy="111" r="22" fill="#5AB0FF" opacity="0.22" filter="url(#nodeGlow)"/>
  <circle cx="315" cy="234" r="22" fill="#5AB0FF" opacity="0.22" filter="url(#nodeGlow)"/>
  <circle cx="185" cy="234" r="22" fill="#5AB0FF" opacity="0.22" filter="url(#nodeGlow)"/>
  <circle cx="145" cy="111" r="22" fill="#5AB0FF" opacity="0.22" filter="url(#nodeGlow)"/>

  <!-- ── AGENT NODE CIRCLES ─────────────────────────────────────────── -->
  <circle cx="250" cy="35"  r="17" fill="url(#nodeFill)" stroke="#1A4BBF" stroke-width="2.5"/>
  <circle cx="355" cy="111" r="17" fill="url(#nodeFill)" stroke="#1A4BBF" stroke-width="2.5"/>
  <circle cx="315" cy="234" r="17" fill="url(#nodeFill)" stroke="#1A4BBF" stroke-width="2.5"/>
  <circle cx="185" cy="234" r="17" fill="url(#nodeFill)" stroke="#1A4BBF" stroke-width="2.5"/>
  <circle cx="145" cy="111" r="17" fill="url(#nodeFill)" stroke="#1A4BBF" stroke-width="2.5"/>

  <!-- Small inner dot — makes each node read as "active" -->
  <circle cx="250" cy="35"  r="4.5" fill="#2B6DD4" opacity="0.7"/>
  <circle cx="355" cy="111" r="4.5" fill="#2B6DD4" opacity="0.7"/>
  <circle cx="315" cy="234" r="4.5" fill="#2B6DD4" opacity="0.7"/>
  <circle cx="185" cy="234" r="4.5" fill="#2B6DD4" opacity="0.7"/>
  <circle cx="145" cy="111" r="4.5" fill="#2B6DD4" opacity="0.7"/>

  <!-- ── CENTRAL ORCHESTRATOR ORB ───────────────────────────────────── -->
  <!-- Glow halo -->
  <circle cx="250" cy="145" r="46" fill="#2B82E8" opacity="0.2" filter="url(#orbGlow)"/>
  <!-- Outer rim -->
  <circle cx="250" cy="145" r="34" fill="#0A2060" stroke="#4A9FFF" stroke-width="1.5" opacity="0.6"/>
  <!-- Main orb -->
  <circle cx="250" cy="145" r="30" fill="url(#orbGrad)" stroke="#60C4FF" stroke-width="1.2"/>
  <!-- Specular highlight -->
  <ellipse cx="241" cy="134" rx="10" ry="7" fill="white" opacity="0.28"/>
  <!-- Tiny core brightspot -->
  <circle cx="244" cy="137" r="3.5" fill="white" opacity="0.45"/>

  <!-- ── BANNER ──────────────────────────────────────────────────────── -->
  <rect x="74" y="275" width="352" height="68" rx="13" ry="13"
        fill="url(#bannerGrad)"
        filter="url(#bannerShadow)"/>

  <!-- Top accent line -->
  <rect x="74" y="275" width="352" height="3.5" rx="1.75" fill="#4A9FFF"/>
  <!-- Bottom accent line -->
  <rect x="74" y="339.5" width="352" height="3.5" rx="1.75" fill="#1C5BBF" opacity="0.7"/>

  <!-- ── ARGUS WORDMARK ──────────────────────────────────────────────── -->
  <text
    x="250" y="327"
    font-family="'Arial Black', 'Impact', 'Arial Bold', Arial, sans-serif"
    font-weight="900"
    font-size="50"
    text-anchor="middle"
    fill="white"
    letter-spacing="9">ARGUS</text>

  <!-- ── SUBTITLE ───────────────────────────────────────────────────── -->
  <!-- #4A8FD4 reads well on white; white halo filter makes it pop on dark too -->
  <text
    x="250" y="366"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="500"
    font-size="13"
    text-anchor="middle"
    fill="#4A8FD4"
    letter-spacing="0.6"
    filter="url(#subtitleHalo)">Agentic Risk &amp; Governance Unified Screening</text>

</svg>