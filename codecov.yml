# Codecov reads the report uploaded by the "Tests and coverage" CI job.
# The enforced gate is the pytest-cov floor in pyproject.toml ([tool.coverage.report] fail_under),
# which fails CI on its own. These statuses report the same bar on pull requests.
coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        # Every measured line and branch is covered; any drop fails.
        target: 100%
    patch:
      default:
        # Every changed line must be covered.
        target: 100%

comment:
  layout: "diff, files"
  require_changes: true
