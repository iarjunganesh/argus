version: "3.9"

# SKETCH ONLY: this does not run. It is the intended shape of the Community Edition stack
# described in community-edition.md; the community Dockerfile (the root Dockerfile builds the API
# only), a web/Dockerfile, and the SQLite and Qdrant backends it expects don't exist yet. Local
# OCR through Tesseract does exist (argus.data_plane.tesseract), and so does the web UI (web/).
#
# ARGUS Community Edition — one command, no Azure subscription required.
#
# Services:
#   argus-api         FastAPI backend (all 5 agents run in-process for simplicity)
#   argus-ui          The web UI (web/), built with NEXT_PUBLIC_API_URL=http://localhost:8000
#   qdrant            Local vector DB replacing Azure AI Search
#
# Usage:
#   docker compose -f docs/roadmap/community-edition.compose.yml up   (once it exists)
#   Then open: http://localhost:3000

services:

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  argus-api:
    build:
      context: ..
      dockerfile: community/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ARGUS_EDITION=community
      - ARGUS_CORS_ORIGINS=http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
      - VECTOR_BACKEND=qdrant
      - QDRANT_URL=http://qdrant:6333
      - ENTITY_STORE=sqlite
      - SQLITE_PATH=/data/community.db
      - OCR_BACKEND=tesseract
      - USE_OPEN_CORPUS=true
    volumes:
      - sqlite_data:/data
      - ../community/knowledge_base:/app/community/knowledge_base:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  argus-ui:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # The browser calls the API, so this is the address as the browser sees it.
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      argus-api:
        condition: service_healthy

volumes:
  qdrant_data:
  sqlite_data:
