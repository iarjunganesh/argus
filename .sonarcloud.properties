# SonarQube Cloud automatic analysis reads only file-scope settings from this file.
#
# archive/ is frozen hackathon material, kept as submitted (AGENTS.md).
# The synthetic data generators draw records from a seeded `random` on purpose, so each run
# reproduces the same data set; nothing they produce is a secret (ruff's S311 is off there too).
# web/src/app/shadcn.css is the shadcn package's stylesheet, copied unchanged. It is Tailwind CSS
# input (@custom-variant with @slot, @utility with nested rules), which the CSS rules read as
# invalid plain CSS; Tailwind compiles it, and the build and Playwright tests check the result.
sonar.exclusions=archive/**,data/**/generate_*.py,web/src/app/shadcn.css
